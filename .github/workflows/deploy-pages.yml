name: Build and deploy Visit Benin Tours

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install blog dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare publication directory
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
      - name: Generate CMS articles, language listings and sitemap
        env:
          SITE_OUTPUT_DIR: ${{ github.workspace }}/_site
        run: python build_blog_from_cms.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
